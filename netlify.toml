[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm ci && echo 'build v131'"
  # Force rebuild cache bust: 2026-11-04

[functions]
  node_bundler = "esbuild"
  included_files = []

# Daily housekeeping: prune the face detection log (and its stored face photos)
# to 30 days, so an always-on kiosk cannot grow the table indefinitely.
[functions."kiosk-cleanup"]
  schedule = "0 3 * * *"

# ── CORS headers ──────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Session-Token"

# ── Kiosk + pages: never cache HTML, so a redeploy is picked up at once ──
[[headers]]
  for = "/kiosk/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/website/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

# ── PWA: never cache the service worker so updates apply ─────
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── PWA: correct manifest MIME + long cache for icons ─────────
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Session-Token"

# ── Block PHP / sensitive files (served as text on Netlify) ──
# force=true is required: Netlify would otherwise serve the real
# file instead of honoring the redirect.
[[redirects]]
  from = "/config.php"
  to = "/.netlify/functions/"
  status = 404
  force = true

[[redirects]]
  from = "/admin_api.php"
  to = "/.netlify/functions/"
  status = 404
  force = true

