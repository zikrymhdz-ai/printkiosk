<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PrintKiosk">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/icon-512.png">
<title>PrintKiosk - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="../frontend_config.js"></script>
<script src="pstore.js"></script>
<style>
  :root{
    --bg-top:#f7faff;
    --bg-bottom:#ffffff;
    --accent:#2563eb;
    --accent-2:#0d9488;
    --accent-deep:#1d4ed8;
    --ink:#172033;
    --muted:#64748b;
    --field:#f1f5f9;
    --field-border:#e2e8f0;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0;
    min-height:100%;
    font-family:'DM Sans', -apple-system, system-ui, sans-serif;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
  }
  body{ display:flex; min-height:100vh; }

  .auth-card{
    width:100%;
    max-width:380px;
    margin:auto;
    padding:28px 6px;
  }

  /* ---- header: printer intro animation (loops every 3s) ---- */
  .intro-rig{
    position:relative;
    width:100%;
    height:150px;
    margin-bottom:6px;
    overflow:hidden;
  }
  .intro-printer{
    position:absolute;
    left:50%;
    bottom:14px;
    width:118px;
    height:58px;
    transform:translateX(-50%);
    transform-origin:bottom center;
    animation:introSquashLoop 3s ease-out infinite;
  }
  .intro-printer .body{
    position:absolute;
    inset:0;
    background:var(--ink);
    border-radius:12px 12px 6px 6px;
  }
  .intro-printer .body::before{
    content:'';
    position:absolute;
    left:8px; right:8px; top:6px;
    height:6px;
    border-radius:4px;
    background:#1e293b;
  }
  .intro-printer .slot{
    position:absolute;
    top:-5px; left:18px; right:18px;
    height:9px;
    background:#0f172a;
    border-radius:4px;
  }
  .intro-printer .light{
    position:absolute;
    right:12px; bottom:11px;
    width:6px; height:6px;
    border-radius:50%;
    background:var(--accent-2);
    box-shadow:none;
    animation:introBlink 1.1s ease-in-out infinite;
  }
  .intro-printer .base{
    position:absolute;
    left:-6px; right:-6px; bottom:-8px;
    height:10px;
    background:#0f172a;
    border-radius:6px;
  }

  .intro-paper{
    position:absolute;
    left:50%;
    bottom:58px;
    width:66px;
    height:84px;
    margin-left:-33px;
    background:#ffffff;
    border-radius:3px;
    box-shadow:0 6px 14px rgba(2,32,71,0.18);
    opacity:0;
    padding:10px 9px;
    animation:introPaperLoop 3s linear infinite;
  }
  .intro-paper .line{
    height:4px;
    border-radius:2px;
    background:#d8e1ef;
    margin-bottom:6px;
  }
  .intro-paper .line.w3{
    background:var(--accent);
    opacity:0.55;
    width:55%;
  }

  @keyframes introSquashLoop{
    0%{ transform:translateX(-50%) scaleY(1); }
    3%{ transform:translateX(-50%) scaleY(0.9); }
    7%{ transform:translateX(-50%) scaleY(1.04); }
    12%,100%{ transform:translateX(-50%) scaleY(1); }
  }
  @keyframes introBlink{
    0%,100%{ opacity:1; }
    50%{ opacity:0.35; }
  }
  @keyframes introPaperLoop{
    0%,6.4%{ opacity:0; bottom:44px; left:50%; margin-left:-33px; transform:rotate(0deg) scale(1); }
    8%{ opacity:1; }
    26.6%{ opacity:1; bottom:80px; left:50%; margin-left:-33px; transform:rotate(-3deg) scale(1); }
    28.4%{ opacity:1; bottom:80px; left:50%; margin-left:-33px; transform:rotate(-3deg) scale(1); }
    48.3%{ opacity:0; bottom:230px; left:66%; margin-left:-33px; transform:rotate(26deg) scale(0.45); }
    100%{ opacity:0; bottom:230px; left:66%; margin-left:-33px; transform:rotate(26deg) scale(0.45); }
  }

  .auth-title{
    font-size:26px;
    font-weight:800;
    margin:0 0 6px;
    color:var(--ink);
    text-align:center;
  }
  .auth-subtitle{
    margin:0 0 26px;
    font-size:13.5px;
    color:var(--muted);
    text-align:center;
  }

  /* ---- fields ---- */
  .field{
    position:relative;
    margin-bottom:12px;
  }
  .field input{
    width:100%;
    padding:15px 16px;
    border-radius:14px;
    border:1px solid var(--field-border);
    background:var(--field);
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
    outline:none;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .field input[type=password]{ padding-right:46px; }
  .field input::placeholder{ color:#b3bfd1; }
  .field input:focus{
    border-color:var(--accent);
    background:#ffffff;
  }
  .field .eye{
    position:absolute;
    right:14px; top:50%;
    transform:translateY(-50%);
    width:18px; height:18px;
    stroke:var(--muted);
    stroke-width:1.7;
    fill:none;
    cursor:pointer;
  }

  .row-between{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:2px 2px 20px;
  }
  .row-between a{
    font-size:12.5px;
    font-weight:700;
    color:var(--accent);
    text-decoration:none;
    cursor:pointer;
  }

  .remember{
    display:flex;
    align-items:center;
    gap:7px;
    cursor:pointer;
    user-select:none;
  }
  .remember input{
    width:16px; height:16px;
    margin:0;
    accent-color:var(--accent);
    cursor:pointer;
  }
  .remember span{
    font-size:12.5px;
    font-weight:600;
    color:var(--muted);
  }

  .submit-btn{
    width:100%;
    padding:16px 0;
    border:none;
    border-radius:999px;
    background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    color:#ffffff;
    font-family:inherit;
    font-size:14px;
    font-weight:800;
    letter-spacing:0.06em;
    cursor:pointer;
    box-shadow:0 14px 26px rgba(15,23,42,0.18);
  }
  .submit-btn:active{ transform:scale(0.98); }
  .submit-btn:disabled{ opacity:0.6; cursor:default; }

  .guest-btn{
    display:block;
    width:100%;
    margin-top:16px;
    padding:15px 0;
    border-radius:999px;
    border:1px solid var(--field-border);
    background:transparent;
    color:var(--accent);
    font-family:inherit;
    font-size:14px;
    font-weight:800;
    text-decoration:none;
    text-align:center;
    cursor:pointer;
  }
  .guest-btn:active{ transform:scale(0.98); }

  .switch-line{
    text-align:center;
    margin-top:20px;
    font-size:13px;
    color:var(--muted);
  }
  .switch-line a{
    color:var(--accent);
    font-weight:800;
    text-decoration:none;
    cursor:pointer;
  }

  .error-text{ font-size:13px; color:#dc2626; }
  .success-text{ font-size:13px; color:#15803d; }

  .btn-spinner{
    display:inline-block;
    width:16px; height:16px;
    margin-right:8px;
    vertical-align:-3px;
    border:2px solid rgba(255,255,255,0.4);
    border-top-color:#ffffff;
    border-radius:50%;
    animation:btnSpin 0.7s linear infinite;
  }
  @keyframes btnSpin{ to{ transform:rotate(360deg); } }

  /* ---- login loader overlay ---- */
  #loginLoader.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    z-index:9999;
  }
  #loginLoader.overlay.active{ display:flex; }

  #loginLoader .loader-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }

  #loginLoader .spinner{
    position:relative;
    width:64px;
    height:64px;
  }
  #loginLoader .ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent,#2563eb), var(--accent-2,#0d9488), transparent 78%);
    animation:loginSpin 0.9s linear infinite;
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 7px), #0f172a calc(100% - 7px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 7px), #0f172a calc(100% - 7px));
  }
  #loginLoader .core{
    position:absolute;
    inset:22px;
    border-radius:50%;
    background:#ffffff;
    box-shadow:0 2px 10px rgba(2,32,71,0.18);
  }
  @keyframes loginSpin{ to{ transform:rotate(360deg); } }

  #loginLoader .label{
    display:flex;
    align-items:baseline;
    gap:2px;
    font-family:'DM Sans', Inter, sans-serif;
    font-size:15px;
    font-weight:700;
    color:var(--ink,#172033);
    text-shadow:0 1px 3px rgba(255,255,255,0.6);
  }
  #loginLoader .dot{
    animation:loginPulse 1.2s ease-in-out infinite;
    opacity:0.25;
  }
  #loginLoader .dot:nth-child(2){ animation-delay:0.15s; }
  #loginLoader .dot:nth-child(3){ animation-delay:0.3s; }
  @keyframes loginPulse{
    0%, 100%{ opacity:0.25; transform:translateY(0); }
    35%{ opacity:1; transform:translateY(-2px); }
  }

  /* ===== shared identity pass - mirrors styles.css =====
     These pages carry their own <style> instead of linking styles.css,
     so the shared identity is repeated here. Keep in step with the
     tokens in styles.css when either changes. */
  html, body { font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  .auth-title { font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Source Serif 4',Georgia,'Times New Roman',serif;
    font-weight:600; letter-spacing:-0.015em; }
  .auth-subtitle { color:#5b6b83; }
  .field input::placeholder, input::placeholder { color:#64748b; opacity:1; }
  :focus-visible { outline:2px solid #2563eb; outline-offset:2px; }
  ::selection { background:#e8efff; color:#0f172a; }
  .field input, .modal-card input, input[type=text], input[type=email], input[type=password], input[type=tel] {
    border-radius:10px; border-color:#cbd5e1; box-shadow:inset 0 1px 2px rgba(15,23,42,0.05);
    transition:border-color .2s ease, box-shadow .2s ease, background .2s ease; color:#0f172a; }
  .field input:focus, .modal-card input:focus { border-color:#2563eb; box-shadow:0 0 0 3px #e8efff; background:#ffffff; }
  /* Rubber-stamp button: thickness that collapses when pressed. */
  .submit-btn, .chip-btn, .link-btn {
    border-radius:10px; background:#2563eb; border:1px solid #1e40af; color:#ffffff;
    box-shadow:0 2px 0 #1e40af, 0 10px 20px -10px rgba(29,78,216,0.55);
    transition:transform .12s ease, box-shadow .16s ease, background .2s ease; }
  .submit-btn:hover:not(:disabled), .chip-btn:hover:not(:disabled) { background:#1d4ed8; transform:translateY(-1px);
    box-shadow:0 3px 0 #1e40af, 0 14px 24px -12px rgba(29,78,216,0.6); }
  .submit-btn:active:not(:disabled), .chip-btn:active:not(:disabled) { transform:translateY(1px); box-shadow:0 1px 0 #1e40af; }
  .guest-btn { border-radius:10px; border-color:#cbd5e1; transition:background .2s ease, border-color .2s ease; }
  .guest-btn:hover { background:#e8efff; border-color:#2563eb; }
  .row-between a, .switch-line a, .terms-row a { text-decoration:none; border-bottom:1px solid transparent; transition:border-color .2s ease; }
  .row-between a:hover, .switch-line a:hover, .terms-row a:hover { border-bottom-color:currentColor; }
  .modal-card { border-radius:14px; border:1px solid #e2e8f0; }
  .modal-overlay { background:rgba(15,23,42,0.42); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }
</style>
</head>
<body>

<div class="auth-card">

  <div class="intro-rig">
    <div class="intro-paper">
      <div class="line" style="width:100%"></div>
      <div class="line" style="width:80%"></div>
      <div class="line w3"></div>
    </div>
    <div class="intro-printer">
      <div class="slot"></div>
      <div class="body"><div class="light"></div></div>
      <div class="base"></div>
    </div>
  </div>

  <form id="loginForm">
    <h1 class="auth-title">Login Now</h1>
    <p class="auth-subtitle">Please enter your details to continue printing.</p>

    <div class="field">
      <input type="email" id="email" placeholder="Email address" required autocomplete="email">
    </div>
    <div class="field">
      <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
      <svg class="eye" data-target="password" viewBox="0 0 24 24"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
    </div>

    <div class="row-between">
      <label class="remember">
        <input type="checkbox" id="rememberMe">
        <span>Remember me</span>
      </label>
      <a href="javascript:void(0)" onclick="showForgot()">Forgot Password?</a>
    </div>

    <p id="loginError" class="error-text" style="display:none; text-align:center; margin-bottom:12px;"></p>

    <button type="submit" class="submit-btn" id="loginBtn">LOG IN</button>
  </form>

  <form id="forgotForm" style="display:none;">
    <h1 class="auth-title" style="font-size:22px;">Reset Password</h1>
    <p class="auth-subtitle">Enter your email and we'll send a link to create a new password</p>

    <div class="field">
      <input type="email" id="forgotEmail" placeholder="Email address" required autocomplete="email">
    </div>
    <p id="forgotMsg" class="error-text" style="display:none; text-align:center; margin-bottom:12px;"></p>
    <button type="submit" class="submit-btn" id="forgotBtn">SEND RESET LINK</button>
    <div id="forgotHint" style="display:none; text-align:center; margin-top:14px; font-size:13px;">
      <a href="javascript:void(0)" onclick="sendResetLink(forgotEmailPending || document.getElementById('forgotEmail').value.trim())" style="color:var(--accent); font-weight:700; text-decoration:none;">Didn't get the email? Send it again</a>
    </div>
    <div style="text-align:center; margin-top:14px; font-size:13px; color:var(--muted);">
      <a href="javascript:void(0)" onclick="showLogin()" style="color:var(--accent); font-weight:700; text-decoration:none;">Back to login</a>
    </div>
  </form>

  <a href="upload.html" class="guest-btn">Continue as Guest</a>

  <p class="switch-line">Don't have an account? <a href="register.html">Sign Up</a></p>

</div>

<!-- LOGIN LOADER OVERLAY -->
<div class="overlay" id="loginLoader">
  <div class="loader-card">
    <div class="spinner">
      <div class="ring"></div>
      <div class="core"></div>
    </div>
    <div class="label">
      <span>Logging you in</span><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = CONFIG.SUPABASE_URL;
const SUPABASE_KEY = CONFIG.SUPABASE_KEY;

document.querySelectorAll('.eye').forEach(function(icon) {
  icon.addEventListener('click', function() {
    const input = document.getElementById(icon.dataset.target);
    if (input) input.type = input.type === 'password' ? 'text' : 'password';
  });
});

function showForgot() {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('forgotForm').style.display = 'block';
  document.getElementById('forgotMsg').style.display = 'none';
  document.getElementById('forgotEmail').focus();
}

function showLoginLoader() {
  document.getElementById('loginLoader').classList.add('active');
}

function hideLoginLoader() {
  document.getElementById('loginLoader').classList.remove('active');
}

function showLogin() {
  document.getElementById('forgotForm').style.display = 'none';
  document.getElementById('loginForm').style.display = 'block';
}

function showResetMsg(el, msg, isSuccess) {
  el.className = isSuccess ? 'success-text' : 'error-text';
  el.style.color = isSuccess ? '#16a34a' : '#dc2626';
  el.textContent = msg;
  el.style.display = 'block';
}

let forgotEmailPending = '';

function setLoading(btn, loading, text) {
  btn.disabled = loading;
  if (loading) {
    btn.innerHTML = '<span class="btn-spinner"></span>' + text;
  } else {
    btn.innerHTML = text;
  }
}

function sendResetLink(email) {
  const msgEl = document.getElementById('forgotMsg');
  const btn = document.getElementById('forgotBtn');

  setLoading(btn, true, 'Sending...');

  return fetch(API('auth', 'forgot-password'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, site: window.location.origin })
  })
  .then(async (res) => {
    const data = await res.json().catch(() => ({}));
    if (!data.success) throw new Error(data.error || 'Request failed');
    return data;
  })
  .then((data) => {
    forgotEmailPending = email;
    showResetMsg(msgEl, data.message || 'If an account exists, a reset link has been sent. Check your inbox (including spam).', true);
    const hint = document.getElementById('forgotHint');
    if (hint) hint.style.display = 'block';
  })
  .catch((err) => {
    showResetMsg(msgEl, err.message || 'Connection error. Please try again.', false);
  })
  .finally(() => {
    setLoading(btn, false, 'Send Reset Link');
  });
}

document.getElementById('forgotForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const email = document.getElementById('forgotEmail').value.trim();
  const msgEl = document.getElementById('forgotMsg');
  msgEl.style.display = 'none';
  sendResetLink(email);
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  errorEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  showLoginLoader();

  try {
    const res = await fetch(API('auth', 'login'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!data.success) {
      hideLoginLoader();
      errorEl.textContent = data.error || 'Login failed';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'LOG IN';
      return;
    }
    const rememberMe = document.getElementById('rememberMe').checked;
    if (rememberMe) {
      // Email only. Saving the password would leave a plaintext credential in
      // storage, and the browser's own password manager already handles it.
      PKS.set('remembered_login', JSON.stringify({ email: email.trim() }));
    } else {
      PKS.remove('remembered_login');
    }
    PKS.set('session_token', data.session_token);
    PKS.set('user', JSON.stringify(data.user));
    if (data.user.role === 'admin') window.location.href = '../admin/admin.html';
    else window.location.href = 'customer.html';
  } catch (err) {
    hideLoginLoader();
    errorEl.textContent = 'Connection error. Please try again.';
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'LOG IN';
  }
});

(function() {
  const emailInp = document.getElementById('email');
  const passInp = document.getElementById('password');
  const rememberMeInp = document.getElementById('rememberMe');
  const loginBtn = document.getElementById('loginBtn');
  const errorEl = document.getElementById('loginError');

  PKS.init().then(function() {
    const remembered = localStorage.getItem('remembered_login');
    if (remembered) {
      try {
        const cred = JSON.parse(remembered);
        if (cred && cred.email) {
          emailInp.value = cred.email;
          rememberMeInp.checked = true;
        }
        // An older build also stored the password. Strip it on load, keeping
        // the email when there is one, so the plaintext does not linger.
        if (cred && Object.prototype.hasOwnProperty.call(cred, 'password')) {
          if (cred.email) PKS.set('remembered_login', JSON.stringify({ email: cred.email }));
          else PKS.remove('remembered_login');
        }
      } catch (e) {
        // Unreadable value: remove it rather than leave a blob of unknown
        // content behind.
        PKS.remove('remembered_login');
      }
    }

    const token = localStorage.getItem('session_token');
    if (!token) return;

    emailInp.disabled = true;
    passInp.disabled = true;
    loginBtn.disabled = true;
    errorEl.style.display = 'block';
    errorEl.style.color = 'var(--muted)';
    errorEl.textContent = 'Restoring your session...';

    fetch(API('auth', 'verify-session'), {
      method: 'POST',
      headers: { 'X-Session-Token': token }
    })
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        PKS.set('user', JSON.stringify(data.user));
        if (data.user.role === 'admin') window.location.href = '../admin/admin.html';
        else window.location.href = 'customer.html';
      } else {
        PKS.remove('session_token');
        PKS.remove('user');
        restoreForm();
      }
    })
    .catch(() => {
      restoreForm();
    });

    function restoreForm() {
      emailInp.disabled = false;
      passInp.disabled = false;
      loginBtn.disabled = false;
      errorEl.style.display = 'none';
    }
  });
})();
</script>
</body>
</html>
