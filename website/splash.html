<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PrintKiosk">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/icon-512.png">
<title>PrintKiosk â€” Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#f7faff;
    --bg-bottom:#ffffff;
    --printer-body:#2e3a52;
    --printer-body-light:#46536b;
    --printer-slot:#131a2b;
    --paper:#ffffff;
    --paper-line:#d8e1ef;
    --accent:#2563eb;
    --accent-2:#0d9488;
    --ink:#172033;
    --muted:#8a97ad;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:'DM Sans', -apple-system, system-ui, sans-serif;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
  }

  /* ================= SPLASH STAGE ================= */
  .stage{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity 0.45s ease;
  }
  .stage.fade-out{ opacity:0; pointer-events:none; }

  .rig{
    position:relative;
    width:280px;
    height:280px;
  }

  /* ---- printer ---- */
  .printer{
    position:absolute;
    left:50%;
    bottom:78px;
    width:168px;
    height:82px;
    transform:translateX(-50%);
    transform-origin:bottom center;
    animation:printerSquash 0.7s ease-out 0.05s 1;
  }
  .printer-body{
    position:absolute;
    inset:0;
    background:var(--printer-body);
    border-radius:14px 14px 8px 8px;
  }
  .printer-body::before{
    content:'';
    position:absolute;
    left:10px; right:10px; top:8px;
    height:8px;
    border-radius:5px;
    background:var(--printer-body-light);
  }
  .printer-slot{
    position:absolute;
    top:-6px; left:24px; right:24px;
    height:12px;
    background:var(--printer-slot);
    border-radius:4px;
  }
  .printer-light{
    position:absolute;
    right:16px; bottom:16px;
    width:8px; height:8px;
    border-radius:50%;
    background:var(--accent-2);
    box-shadow:none;
    animation:blink 1.1s ease-in-out infinite;
  }
  .printer-base{
    position:absolute;
    left:-8px; right:-8px; bottom:-10px;
    height:14px;
    background:#242f45;
    border-radius:8px;
  }

  /* ---- paper ---- */
  .paper{
    position:absolute;
    left:50%;
    bottom:154px;
    width:96px;
    height:126px;
    margin-left:-48px;
    background:var(--paper);
    border-radius:3px;
    box-shadow:0 8px 20px rgba(2,32,71,0.18);
    opacity:0;
    padding:16px 14px;
    animation:
      paperEject 0.75s cubic-bezier(.34,1.35,.64,1) 0.15s forwards,
      paperFly   1.05s cubic-bezier(.55,0,.85,.4) 0.9s forwards;
  }
  .paper-line{
    height:6px;
    border-radius:3px;
    background:var(--paper-line);
    margin-bottom:10px;
  }
  .paper-line.w1{ width:100%; }
  .paper-line.w2{ width:82%; }
  .paper-line.w3{ width:60%; background:var(--accent); opacity:0.55; }

  .puff{
    position:absolute;
    left:50%;
    bottom:150px;
    width:10px; height:10px;
    margin-left:-5px;
    border-radius:50%;
    background:rgba(120,140,180,0.35);
    opacity:0;
    animation:puff 0.6s ease-out 0.55s forwards;
  }

  /* ---- logo lockup ---- */
  .logo{
    position:absolute;
    left:50%; top:62%;
    transform:translate(-50%,12px) scale(0.85);
    text-align:center;
    opacity:0;
    animation:logoIn 0.6s cubic-bezier(.2,1.4,.4,1) 1.95s forwards;
  }
  .logo h1{
    margin:0;
    font-size:30px;
    font-weight:900;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  .logo h1 span{ color:var(--accent); }
  .logo p{
    margin:6px 0 0;
    font-size:13px;
    font-weight:500;
    letter-spacing:0.04em;
    color:var(--muted);
  }

  .confetti-dot{
    position:absolute;
    left:50%; top:62%;
    width:6px; height:6px;
    border-radius:50%;
    opacity:0;
  }

  /* ================= keyframes ================= */
  @keyframes printerSquash{
    0%{ transform:translateX(-50%) scaleY(1); }
    12%{ transform:translateX(-50%) scaleY(0.9); }
    30%{ transform:translateX(-50%) scaleY(1.04); }
    50%{ transform:translateX(-50%) scaleY(1); }
  }

  @keyframes blink{
    0%,100%{ opacity:1; }
    50%{ opacity:0.35; }
  }

  @keyframes paperEject{
    0%{ opacity:0; bottom:118px; transform:rotate(0deg); }
    18%{ opacity:1; }
    100%{ opacity:1; bottom:182px; transform:rotate(-3deg); }
  }

  @keyframes paperFly{
    0%{ bottom:182px; left:50%; margin-left:-48px; transform:rotate(-3deg) scale(1); opacity:1; }
    100%{ bottom:560px; left:78%; margin-left:-48px; transform:rotate(28deg) scale(0.35); opacity:0; }
  }

  @keyframes puff{
    0%{ opacity:0.5; transform:scale(1) translateY(0); }
    100%{ opacity:0; transform:scale(3.2) translateY(-18px); }
  }

  @keyframes logoIn{
    0%{ opacity:0; transform:translate(-50%,12px) scale(0.85); }
    60%{ opacity:1; transform:translate(-50%,-2px) scale(1.03); }
    100%{ opacity:1; transform:translate(-50%,0) scale(1); }
  }

  @keyframes confettiBurst{
    0%{ opacity:1; transform:translate(0,0) scale(1); }
    100%{ opacity:0; transform:translate(var(--dx),var(--dy)) scale(0.4); }
  }

  /* ===== shared identity pass - mirrors styles.css =====
     These pages carry their own <style> instead of linking styles.css,
     so the shared identity is repeated here. Keep in step with the
     tokens in styles.css when either changes. */
  html, body { font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  .auth-title { font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Source Serif 4',Georgia,'Times New Roman',serif;
    font-weight:600; letter-spacing:-0.015em; }
  .auth-subtitle { color:#5b6b83; }
  :focus-visible { outline:2px solid #2563eb; outline-offset:2px; }
  ::selection { background:#e8efff; color:#0f172a; }
  .field input, .modal-card input, input[type=text], input[type=email], input[type=password], input[type=tel] {
    border-radius:10px; border-color:#cbd5e1; box-shadow:inset 0 1px 2px rgba(15,23,42,0.05);
    transition:border-color .2s ease, box-shadow .2s ease, background .2s ease; color:#0f172a; }
  .field input:focus, .modal-card input:focus { border-color:#2563eb; box-shadow:0 0 0 3px #e8efff; background:#ffffff; }
  /* Rubber-stamp button: thickness that collapses when pressed. */
  .submit-btn, .chip-btn, .link-btn {
    border-radius:10px; background:#2563eb; border:1px solid #1e40af; color:#ffffff;
    box-shadow:0 2px 0 #1e40af, 0 10px 20px -10px rgba(29,78,216,0.55);
    transition:transform .12s ease, box-shadow .16s ease, background .2s ease; }
  .submit-btn:hover:not(:disabled), .chip-btn:hover:not(:disabled) { background:#1d4ed8; transform:translateY(-1px);
    box-shadow:0 3px 0 #1e40af, 0 14px 24px -12px rgba(29,78,216,0.6); }
  .submit-btn:active:not(:disabled), .chip-btn:active:not(:disabled) { transform:translateY(1px); box-shadow:0 1px 0 #1e40af; }
  .guest-btn { border-radius:10px; border-color:#cbd5e1; transition:background .2s ease, border-color .2s ease; }
  .guest-btn:hover { background:#e8efff; border-color:#2563eb; }
  .row-between a, .switch-line a, .terms-row a { text-decoration:none; border-bottom:1px solid transparent; transition:border-color .2s ease; }
  .row-between a:hover, .switch-line a:hover, .terms-row a:hover { border-bottom-color:currentColor; }
  .modal-card { border-radius:14px; border:1px solid #e2e8f0; }
  .modal-overlay { background:rgba(15,23,42,0.42); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="rig">
    <div class="paper" id="paper">
      <div class="paper-line w1"></div>
      <div class="paper-line w2"></div>
      <div class="paper-line w3"></div>
    </div>
    <div class="puff"></div>

    <div class="printer">
      <div class="printer-slot"></div>
      <div class="printer-body">
        <div class="printer-light"></div>
      </div>
      <div class="printer-base"></div>
    </div>

    <div class="logo" id="logo">
      <h1>Print<span>Kiosk</span></h1>
      <p>PRINT&nbsp;&middot;&nbsp;PAY&nbsp;&middot;&nbsp;PICKUP</p>
    </div>

    <div id="confettiHost"></div>
  </div>
</div>

<script src="../frontend_config.js"></script>
<script src="pstore.js"></script>
<script>
  // confetti burst timed with logo reveal
  const host = document.getElementById('confettiHost');
  const colors = ['#3b6ef6', '#22c7b8', '#ffb648', '#ff6f91'];
  for(let i=0;i<12;i++){
    const dot = document.createElement('div');
    dot.className = 'confetti-dot';
    const angle = (Math.PI * 2 * i) / 12 + Math.random()*0.3;
    const dist = 60 + Math.random()*40;
    dot.style.setProperty('--dx', (Math.cos(angle)*dist) + 'px');
    dot.style.setProperty('--dy', (Math.sin(angle)*dist - 20) + 'px');
    dot.style.background = colors[i % colors.length];
    dot.style.animation = `confettiBurst 0.8s ease-out ${2.0 + Math.random()*0.1}s forwards`;
    host.appendChild(dot);
  }

  const stage = document.getElementById('stage');

  // Where to land after the intro. The login page can also restore a session,
  // but going through it first flashed the form before forwarding. Here the
  // persisted token is checked against the sessions table (exists + not
  // expired) while the intro plays, so a valid session opens home directly.
  var target = 'login.html';

  function decide(page) { target = page; }

  function leave() {
    stage.classList.add('fade-out');
    setTimeout(function () { window.location.href = target; }, 480);
  }

  (function restoreSession() {
    if (!window.PKS || typeof API !== 'function') { decide('login.html'); return; }
    PKS.init().then(function () {
      var token = null;
      try { token = localStorage.getItem('session_token'); } catch (e) {}
      if (!token) { decide('login.html'); return; }

      return fetch(API('auth', 'verify-session'), {
        method: 'POST',
        headers: { 'X-Session-Token': token }
      }).then(function (r) {
        return r.json().then(function (d) { return { ok: r.ok && d && d.success, data: d }; });
      }).then(function (res) {
        if (res.ok && res.data && res.data.user) {
          PKS.set('user', JSON.stringify(res.data.user));
          decide(res.data.user.role === 'admin' ? '../admin/admin.html' : 'customer.html');
        } else {
          PKS.remove('session_token');
          PKS.remove('user');
          decide('login.html');
        }
      });
    }).catch(function () { decide('login.html'); });
  })();

  // The intro runs for 2.6s; navigate when it ends using whatever the check
  // resolved to. If the check is still in flight, login.html repeats it.
  setTimeout(leave, 2600);
</script>

</body>
</html>
